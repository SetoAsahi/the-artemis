<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090807">
  <title>CAST | The Artemis</title>
  <meta name="description" content="The Artemis Cast Profile">
  <link rel="icon" type="image/png" href="/assets/the-artemis-symbol.png">
  <link rel="apple-touch-icon" href="/assets/the-artemis-symbol.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=7">
  <link rel="stylesheet" href="/cast-profile.css?v=1">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="profile-header">
    <a class="brand" href="/"><span class="brand-mark">A</span><span><strong id="profileBrand">The Artemis</strong><small>LUXURY CABARET</small></span></a>
    <a class="profile-back-top" href="/#cast">CAST LIST <span>→</span></a>
  </header>

  <main class="profile-main" id="profileMain">
    <section class="profile-shell" id="profileContent" hidden>
      <div class="profile-visual">
        <div class="profile-image-wrap" id="profileImageWrap"></div>
        <div class="profile-number" id="profileTodayBadge" hidden>TODAY</div>
      </div>
      <div class="profile-info">
        <p class="eyebrow">THE ARTEMIS CAST</p>
        <p class="profile-roman" id="profileRoman"></p>
        <h1 id="profileName"></h1>
        <div class="profile-rule"></div>
        <div class="profile-today" id="profileToday" hidden>
          <span>TODAY'S SHIFT</span>
          <strong id="profileShift"></strong>
        </div>
        <div class="profile-bio">
          <p class="profile-label">PROFILE</p>
          <p id="profileBio"></p>
        </div>
        <a class="profile-back" href="/#cast">在籍キャスト一覧へ <span>→</span></a>
      </div>
    </section>

    <section class="profile-error" id="profileError" hidden>
      <p class="eyebrow">THE ARTEMIS</p>
      <h1>CAST NOT FOUND</h1>
      <p>キャスト情報が見つかりませんでした。</p>
      <a href="/#cast">在籍キャスト一覧へ戻る</a>
    </section>
  </main>

  <footer class="profile-footer">© <span id="year"></span> The Artemis. All Rights Reserved.</footer>
  <script src="/js/cast-profile.js?v=1"></script>
</body>
</html>
